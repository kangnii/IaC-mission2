[project]
name = "compliance-audit"
version = "0.1.0"
description = "Audit de conformité CIS via OpenSCAP : scan, score, rapport PDF"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4",     # SSH vers les hôtes
    "lxml>=5.0",         # parsing XCCDF
    "prometheus-client>=0.20",  # push du score
    "reportlab>=4.0",    # rapport PDF
    "click>=8.1",        # CLI
]

[project.scripts]
audit = "audit.cli:main"

[tool.setuptools.packages.find]
include = ["audit", "audit.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
