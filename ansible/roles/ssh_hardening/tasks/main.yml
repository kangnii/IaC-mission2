---
# Rôle ssh_hardening
# TODO : implémentation aux jours indiqués dans le planning.
- name: Désactiver la connexion root en SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Redémarrer ssh

- name: Désactiver l'authentification par mot de passe
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Redémarrer ssh

- name: Désactiver l'authentification challenge-response
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?KbdInteractiveAuthentication'
    line: 'KbdInteractiveAuthentication no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Redémarrer ssh

- name: Limiter les utilisateurs autorisés en SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AllowUsers'
    line: "AllowUsers {{ ssh_allowed_users }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Redémarrer ssh

- name: Désactiver X11Forwarding
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?X11Forwarding'
    line: 'X11Forwarding no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Redémarrer ssh

- name: Limiter le nombre de tentatives d'authentification
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries'
    line: 'MaxAuthTries 3'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Redémarrer ssh